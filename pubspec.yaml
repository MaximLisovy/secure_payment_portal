name: secure_payment_portal
description: "Hyper-Tenant Secure Payment Portal: a multi-brand payment confirmation module."
# Not for pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device frame timing of the security scan only (integration_test/); not part of `flutter test`.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
